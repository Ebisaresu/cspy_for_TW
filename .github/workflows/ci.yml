name: CI

# Deliberately has no push trigger. Everything worth checking is checked on
# the pull request that proposes it, and a push to master should not spend
# runner minutes re-checking what was already green.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Build the wheel and run the Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # This is the exact path a user takes with
      # "pip install git+https://github.com/Ebisaresu/cspy_for_TW.git", so a
      # break in the packaging shows up here rather than in a bug report.
      - name: Build the wheel through the build backend
        run: python -m pip wheel . --no-deps -w wheelhouse

      - name: Install the wheel
        run: python -m pip install wheelhouse/*.whl

      - name: Show what was installed
        run: python -m pip show cspy-tw

      # Not a plain "unittest discover": four tests fail for a reason that
      # predates the packaging work, so the runner script deselects exactly
      # those four by name and fails if they ever stop existing. wheels.yml
      # runs the same script against every wheel it builds.
      - name: Run the Python tests
        run: python .github/scripts/run_tests.py

  cpp:
    name: Build and run the C++ tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The googletest suite in test/cc only builds when neither the Python nor
      # the Dotnet binding is being built, so it gets its own job rather than
      # riding along with the one above. Without it the C++ core, which is the
      # part that actually solves anything, would be compiled by continuous
      # integration but never run.
      - name: Configure
        run: cmake -S . -B build -DBUILD_CXX=ON -DBUILD_PYTHON=OFF -DBUILD_DOTNET=OFF -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Run the tests
        run: ctest --test-dir build --output-on-failure

# Two things this workflow deliberately does not do.
#
# It does not check the Dotnet binding or build the documentation. Upstream had
# a job for each; this fork distributes a Python package, has no Dotnet release
# and no published documentation site, so those jobs were removed rather than
# left to fail. Restoring either means restoring its job as well.
#
# It does not check that nothing here can publish to a package index. That check
# needs a push trigger, which this workflow deliberately does not have, so it
# lives in .github/workflows/no-publishing.yml.
